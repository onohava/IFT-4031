# VAE with larger latent space: 16x16x4 = 1024 dimensions
# 4:1 compression ratio for better reconstruction quality

model:
  name: vae-16x16
  input_channels: 1
  latent_dim: 1024  # 16x16x4 = 1024
  hidden_dims: [64, 128]  # Only 2 layers: 64->32->16 spatial
  image_size: 64

data:
  dataset: moving_mnist
  data_path: data/moving_mnist
  num_frames: 16
  batch_size: 32
  num_workers: 4

training:
  max_epochs: 500
  learning_rate: 1e-4
  weight_decay: 1e-5
  recon_weight: 1.0
  kl_weight: 1e-4  # beta-VAE style

  accelerator: gpu
  devices: 4
  strategy: ddp
  precision: 16-mixed

logging:
  project: koopman-diffusion
  name: vae-16x16-500ep
  log_every_n_steps: 50
  save_top_k: 3

checkpointing:
  dirpath: outputs/checkpoints
  filename: vae-16x16-{epoch:02d}-{val_loss:.4f}
  monitor: val/loss
  mode: min
  save_last: true
  every_n_epochs: 50
