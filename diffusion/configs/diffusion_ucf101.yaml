# Video Diffusion with Single-Frame KAE on UCF101 (ApplyLipstick)
# Uses lipstick_single_frame.pth (single-frame, INPUT_FRAMES=1)

model:
  name: diffusion-ucf101

  # Latent space configuration for latent_dim=512
  # 512 = 8 * 8 * 8 (C_lat=8, H_lat=8, W_lat=8)
  image_size: 8
  channels: 8

  # Video configuration
  num_frames: 16

  # U-Net configuration
  dim: 64
  dim_mults: [1, 2, 4]

  # Diffusion configuration
  timesteps: 1000

  # Use single-frame KAE
  use_kae: true
  use_vae: false

kae:
  # Single-frame KAE checkpoint (INPUT_FRAMES=1)
  checkpoint_path: /private/home/soniajoseph/IFT-4031/koopmanAE/results/trained_models_ucf/lipstick_single_frame.pth

  # Model parameters (must match checkpoint)
  latent_dim: 512
  input_channels: 1
  image_size: 64
  dataset_name: UCF101
  input_frames: 1    # Single-frame
  pred_frames: 5

  # Freeze KAE during diffusion training
  freeze: true

data:
  dataset: ucf101
  data_path: /datasets01/UCF101_Frames/frames
  actions: ["ApplyLipstick"]
  batch_size: 16
  num_frames: 16
  image_size: 64
  grayscale: true
  num_workers: 4

training:
  max_epochs: 200
  learning_rate: 2e-4
  gradient_clip_val: 1.0

  # GPU configuration
  accelerator: gpu
  devices: 1
  strategy: auto
  precision: 16-mixed

logging:
  project: koopman-diffusion
  name: diffusion-ucf101
  log_every_n_steps: 50
  save_top_k: 3

checkpointing:
  dirpath: /private/home/soniajoseph/IFT-4031/diffusion/outputs/checkpoints/diffusion_ucf101
  filename: diffusion-ucf101-{epoch:02d}-{train_loss:.4f}
  monitor: train_loss
  mode: min
  save_last: true
