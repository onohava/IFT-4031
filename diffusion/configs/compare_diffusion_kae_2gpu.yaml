# Diffusion training with KAE latent space - for comparison
# Uses pretrained KAE from koopmanAE

model:
  name: diffusion-kae-compare
  image_size: 4
  channels: 4
  num_frames: 16
  dim: 64
  dim_mults: [1, 2, 4]
  timesteps: 1000
  use_kae: true
  use_vae: false

kae:
  checkpoint_path: ../../koopmanAE/results/trained_models_mnist/focal_dice_loss.pth
  latent_dim: 64
  input_channels: 1
  image_size: 64
  dataset_name: MovingMNIST
  input_frames: 5
  pred_frames: 5

data:
  dataset: moving_mnist
  data_path: data/moving_mnist
  batch_size: 32
  num_frames: 16
  num_workers: 4

training:
  max_epochs: 500
  learning_rate: 2e-4
  gradient_clip_val: 1.0
  accelerator: gpu
  devices: 2
  strategy: ddp
  precision: 16-mixed

logging:
  project: koopman-diffusion
  name: diffusion-kae-compare
  log_every_n_steps: 50
  save_top_k: 3

checkpointing:
  dirpath: outputs/checkpoints/diffusion_kae_compare
  monitor: train_loss
  mode: min
  save_last: true
