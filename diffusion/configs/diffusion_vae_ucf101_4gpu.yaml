# Video Diffusion with VAE on UCF101 - 4 GPU (Baseline)
# Uses trained VAE checkpoint

model:
  name: diffusion-vae-ucf101-4gpu

  # Latent space configuration for latent_dim=512
  # 512 = 8 * 8 * 8 (C_lat=8, H_lat=8, W_lat=8)
  image_size: 8
  channels: 8

  # Video configuration
  num_frames: 16

  # U-Net configuration
  dim: 64
  dim_mults: [1, 2, 4]

  # Diffusion configuration
  timesteps: 1000

  # Use VAE (not KAE)
  use_kae: false
  use_vae: true

vae:
  # VAE checkpoint (update path after VAE training completes)
  checkpoint_path: /private/home/soniajoseph/IFT-4031/diffusion/outputs/checkpoints/vae_ucf101/last.ckpt
  latent_dim: 512
  hidden_dims: [32, 64, 128, 256]

data:
  dataset: ucf101
  data_path: /datasets01/UCF101_Frames/frames
  actions: ["ApplyLipstick"]
  batch_size: 16
  num_frames: 16
  image_size: 64
  grayscale: true
  num_workers: 4

training:
  max_epochs: 500
  learning_rate: 2e-4
  gradient_clip_val: 1.0

  # Multi-GPU configuration
  accelerator: gpu
  devices: 4
  strategy: ddp
  precision: 16-mixed

logging:
  project: koopman-diffusion
  name: diffusion-vae-ucf101-4gpu
  log_every_n_steps: 50
  save_top_k: 3

checkpointing:
  dirpath: /private/home/soniajoseph/IFT-4031/diffusion/outputs/checkpoints/diffusion_vae_ucf101
  filename: diffusion-vae-ucf101-{epoch:02d}-{train_loss:.4f}
  monitor: train_loss
  mode: min
  save_last: true
