# Full diffusion training in VAE latent space

model:
  name: diffusion-vae
  image_size: 4  # Latent spatial size (64 = 4*4*4)
  channels: 4    # Latent channels (64 = 4*4*4)
  num_frames: 16
  dim: 64
  dim_mults: [1, 2, 4]
  timesteps: 1000
  use_kae: false
  use_vae: true

vae:
  checkpoint_path: outputs/checkpoints/last-v3.ckpt
  latent_dim: 64

data:
  data_path: data/moving_mnist
  batch_size: 32
  num_frames: 16
  num_workers: 4

training:
  max_epochs: 100
  learning_rate: 2e-4
  gradient_clip_val: 1.0
  accelerator: gpu
  devices: 4
  strategy: ddp
  precision: 16-mixed

logging:
  project: koopman-diffusion
  name: diffusion-vae-full
  log_every_n_steps: 50
  save_top_k: 3

checkpointing:
  dirpath: outputs/checkpoints
  filename: diffusion-vae-{epoch:02d}-{train_loss:.4f}
  monitor: val_loss
  mode: min
  save_last: true
