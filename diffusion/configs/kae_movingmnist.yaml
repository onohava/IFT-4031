# Koopman Autoencoder config for MovingMNIST

model:
  name: kae
  input_channels: 1
  latent_dim: 64
  hidden_dims: [32, 64, 128, 256]
  image_size: 64

data:
  dataset: moving_mnist
  data_path: data/moving_mnist
  num_frames: 16
  batch_size: 32
  num_workers: 4

training:
  max_epochs: 100
  learning_rate: 1e-4
  weight_decay: 1e-5

  # Loss weights
  recon_weight: 1.0
  dynamics_weight: 0.1

  # Distributed
  accelerator: gpu
  devices: 4
  strategy: ddp
  precision: 16-mixed

logging:
  project: koopman-diffusion
  name: kae-movingmnist
  log_every_n_steps: 50
  save_top_k: 3

checkpointing:
  dirpath: outputs/checkpoints
  monitor: val/loss
  mode: min
  save_last: true
  every_n_epochs: 10
