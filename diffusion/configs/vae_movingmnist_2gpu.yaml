# VAE for Moving MNIST - 2 GPU training
# Matching KAE architecture for fair comparison

model:
  name: vae
  input_channels: 1
  latent_dim: 64
  hidden_dims: [32, 64, 128, 256]
  image_size: 64

data:
  dataset: moving_mnist
  data_path: data/moving_mnist
  num_frames: 16
  batch_size: 32
  num_workers: 4

training:
  max_epochs: 200
  learning_rate: 1e-4
  weight_decay: 1e-5
  recon_weight: 1.0
  kl_weight: 1e-4

  accelerator: gpu
  devices: 2
  strategy: ddp
  precision: 16-mixed

logging:
  project: koopman-diffusion
  name: vae-movingmnist-2gpu
  log_every_n_steps: 50
  save_top_k: 3

checkpointing:
  dirpath: outputs/checkpoints/vae_movingmnist
  monitor: val/loss
  mode: min
  save_last: true
  every_n_epochs: 10
