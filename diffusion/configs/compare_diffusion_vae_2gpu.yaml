# Diffusion training with VAE latent space - for comparison
# Uses VAE trained on Moving MNIST

model:
  name: diffusion-vae-compare
  image_size: 4
  channels: 4
  num_frames: 16
  dim: 64
  dim_mults: [1, 2, 4]
  timesteps: 1000
  use_kae: false
  use_vae: true

vae:
  checkpoint_path: outputs/checkpoints/vae_movingmnist/last.ckpt
  latent_dim: 64
  hidden_dims: [32, 64, 128, 256]

data:
  dataset: moving_mnist
  data_path: data/moving_mnist
  batch_size: 32
  num_frames: 16
  num_workers: 4

training:
  max_epochs: 500
  learning_rate: 2e-4
  gradient_clip_val: 1.0
  accelerator: gpu
  devices: 2
  strategy: ddp
  precision: 16-mixed

logging:
  project: koopman-diffusion
  name: diffusion-vae-compare
  log_every_n_steps: 50
  save_top_k: 3

checkpointing:
  dirpath: outputs/checkpoints/diffusion_vae_compare
  monitor: train_loss
  mode: min
  save_last: true
