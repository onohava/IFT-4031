# Video Diffusion with KAE - 4 GPU, <4 hours

model:
  name: video_diffusion_kae

  # Same U-Net as baseline for fair comparison
  dim: 32
  dim_mults: [1, 2, 4]
  channels: 64  # KAE latent_dim (NOT image channels)

  # Same diffusion config
  timesteps: 250
  sampling_timesteps: 50

  # Video config
  num_frames: 16
  image_size: 1  # Latent has no spatial dims

  # USE KAE
  use_kae: true

kae:
  checkpoint_path: outputs/checkpoints/kae-best.ckpt
  latent_dim: 64
  freeze: true  # Don't train KAE during diffusion

data:
  dataset: moving_mnist
  data_path: data/moving_mnist
  num_frames: 16
  batch_size: 16
  num_workers: 4

training:
  max_epochs: 100
  learning_rate: 2e-4
  weight_decay: 0.0
  gradient_clip_val: 1.0

  accelerator: gpu
  devices: 4
  strategy: ddp
  precision: 16-mixed

  save_every_n_epochs: 10
  sample_every_n_epochs: 10

logging:
  project: koopman-diffusion
  name: diffusion-kae-4gpu
  log_every_n_steps: 50
  save_top_k: 3

checkpointing:
  dirpath: outputs/checkpoints
  monitor: train/loss
  mode: min

evaluation:
  num_samples: 16
  compute_fvd: true
